<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none" class="w-full h-full">
  <defs>
    <linearGradient id="succGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#00B4D8"/>
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>
  <circle cx="200" cy="150" r="110" fill="#ECFDF5" opacity="0.8"/>
  <!-- Passport booklet -->
  <g transform="translate(130, 80) rotate(-6)">
    <rect x="0" y="0" width="90" height="130" rx="8" fill="#0A1628"/>
    <rect x="5" y="5" width="80" height="120" rx="6" fill="#1E293B"/>
    <circle cx="45" cy="50" r="20" stroke="#00B4D8" stroke-width="2" fill="none"/>
    <path d="M35 50 L55 50 M45 40 L45 60" stroke="#00B4D8" stroke-width="2"/>
    <text x="45" y="90" fill="#F8FAFC" font-size="10" font-family="sans-serif" font-weight="700" text-anchor="middle" letter-spacing="1">PATHORA</text>
    <text x="45" y="104" fill="#94A3B8" font-size="8" font-family="sans-serif" text-anchor="middle">PASSPORT</text>
  </g>
  <!-- Boarding Pass / Ticket -->
  <g transform="translate(190, 100) rotate(8)">
    <rect x="0" y="0" width="100" height="110" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
    <rect x="0" y="0" width="100" height="24" rx="8" fill="url(#succGrad)"/>
    <text x="50" y="16" fill="#FFFFFF" font-size="10" font-family="sans-serif" font-weight="700" text-anchor="middle">ITINERARY READY</text>
    <line x1="10" y1="42" x2="90" y2="42" stroke="#E2E8F0" stroke-width="1.5" stroke-dasharray="4 3"/>
    <rect x="15" y="55" width="40" height="6" rx="3" fill="#0A1628"/>
    <rect x="15" y="68" width="60" height="5" rx="2.5" fill="#94A3B8"/>
    <!-- Stamp -->
    <circle cx="75" cy="85" r="18" stroke="#10B981" stroke-width="2" stroke-dasharray="3 2" fill="none"/>
    <path d="M68 85 L73 90 L82 80" stroke="#10B981" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
