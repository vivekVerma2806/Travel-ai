<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="pathGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00B4D8" />
      <stop offset="100%" stop-color="#00E5FF" />
    </linearGradient>
    <linearGradient id="sunGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF6B35" />
      <stop offset="100%" stop-color="#FFB020" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes pulseRing {
      0% { r: 50px; opacity: 0.8; stroke-width: 3px; }
      50% { r: 75px; opacity: 0.3; stroke-width: 1.5px; }
      100% { r: 90px; opacity: 0; stroke-width: 0.5px; }
    }
    @keyframes spinCompass {
      0% { transform: rotate(0deg); transform-origin: 100px 100px; }
      100% { transform: rotate(360deg); transform-origin: 100px 100px; }
    }
    .ring-1 { animation: pulseRing 3s cubic-bezier(0.16, 1, 0.3, 1) infinite; }
    .ring-2 { animation: pulseRing 3s cubic-bezier(0.16, 1, 0.3, 1) 1.5s infinite; }
    .compass-needle { animation: spinCompass 12s linear infinite; }
  </style>

  <!-- Background Base -->
  <circle cx="100" cy="100" r="92" fill="#0A1628" />

  <!-- Animated Pulse Rings -->
  <circle class="ring-1" cx="100" cy="100" r="50" fill="none" stroke="#00B4D8" />
  <circle class="ring-2" cx="100" cy="100" r="50" fill="none" stroke="#00E5FF" />

  <!-- Orbit Guides -->
  <circle cx="100" cy="100" r="65" fill="none" stroke="#16243C" stroke-width="2" stroke-dasharray="4 6" />

  <!-- Mountain Silhouette Base -->
  <path d="M50 135 L85 90 L110 115 L140 75 L165 135 Z" fill="#16243C" />
  <path d="M70 135 L95 100 L115 125 L135 95 L155 135 Z" fill="#0A1628" opacity="0.6" />

  <!-- Winding Path -->
  <path d="M60 145 C80 120, 110 130, 100 100 C95 85, 120 70, 140 60" fill="none" stroke="url(#pathGrad)" stroke-width="8" stroke-linecap="round" filter="url(#glow)" />

  <!-- Golden Sun -->
  <circle cx="135" cy="65" r="14" fill="url(#sunGrad)" />

  <!-- Compass Needle Needle Overlay -->
  <g class="compass-needle">
    <line x1="100" y1="20" x2="100" y2="40" stroke="#00E5FF" stroke-width="2" stroke-linecap="round" />
    <circle cx="100" cy="25" r="3" fill="#00E5FF" />
  </g>
</svg>
